<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1200 642" width="1200" height="642" role="img" aria-labelledby="t d">
  <title id="t">claude-pet: how Claude Code drives the desk pet</title>
  <desc id="d">Claude Code on the Mac fires hooks, a shell script sends HTTP requests over Wi-Fi to the ESP32 board, which animates a pixel bot on its display. The board announces itself via mDNS so the Mac can find it as claude-pet.local.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a877f"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97757"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fc1f0"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { fill: #1f1e1d; font-weight: 600; }
      .t { fill: #1f1e1d; }
      .g { fill: #6b6964; }
      .o { fill: #d97757; }
      .box { fill: #ffffff; stroke: #dedcd5; stroke-width: 1; }
      .chip { fill: #f6f5f1; stroke: #e2e0d9; stroke-width: 1; }
      .flow { stroke: #8a877f; stroke-width: 1.5; fill: none; }
      .http { stroke: #d97757; stroke-width: 2.5; fill: none; }
      .ota { stroke: #7fc1f0; stroke-width: 2.5; fill: none; stroke-dasharray: 0.1 6; stroke-linecap: round; }
      .b { fill: #3d8fd1; }
      .mdns { stroke: #8a877f; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <!-- background -->
  <rect y="70" width="1200" height="642" rx="18" fill="#f5f4ef"/>

  <!-- ================= MAC ================= -->
  <g>
    <rect x="30" y="100" width="470" height="590" rx="14" fill="#fbfaf7" stroke="#dedcd5"/>
    <path d="M30,114 a14,14 0 0 1 14,-14 h442 a14,14 0 0 1 14,14 v20 h-470 z" fill="#eceae4"/>
    <circle cx="52" cy="117" r="5.5" fill="#ff5f57"/>
    <circle cx="70" cy="117" r="5.5" fill="#febc2e"/>
    <circle cx="88" cy="117" r="5.5" fill="#28c840"/>
    <text x="265" y="122" class="sans g" font-size="13" text-anchor="middle">Your Mac</text>

    <!-- Claude Code -->
    <rect x="55" y="150" width="420" height="70" rx="10" fill="#fff6f1" stroke="#d97757" stroke-width="1.5"/>
    <g transform="translate(86,185)">
      <rect x="-17" y="-17" width="34" height="34" rx="8" fill="#d97757"/>
      <g stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"><line x1="3.0" y1="0.4" x2="12.4" y2="1.9"/><line x1="2.3" y1="1.9" x2="8.6" y2="6.9"/><line x1="1.1" y1="2.8" x2="4.6" y2="11.6"/><line x1="-0.4" y1="3.0" x2="-1.6" y2="10.9"/><line x1="-1.9" y1="2.3" x2="-7.8" y2="9.8"/><line x1="-2.8" y1="1.1" x2="-10.2" y2="4.0"/><line x1="-3.0" y1="-0.4" x2="-12.4" y2="-1.9"/><line x1="-2.3" y1="-1.9" x2="-8.6" y2="-6.9"/><line x1="-1.1" y1="-2.8" x2="-4.6" y2="-11.6"/><line x1="0.4" y1="-3.0" x2="1.6" y2="-10.9"/><line x1="1.9" y1="-2.3" x2="7.8" y2="-9.8"/><line x1="2.8" y1="-1.1" x2="10.2" y2="-4.0"/></g>
    </g>
    <text x="112" y="181" class="sans h" font-size="17">Claude Code</text>
    <text x="112" y="202" class="sans g" font-size="12">your terminal session: prompts, tools, permissions</text>

    <line x1="265" y1="221" x2="265" y2="246" class="flow" marker-end="url(#ah)"/>
    <text x="276" y="238" class="sans g" font-size="11">fires lifecycle events</text>

    <!-- Hooks -->
    <rect x="55" y="250" width="420" height="112" rx="10" class="box"/>
    <text x="75" y="274" class="sans h" font-size="15">Hooks</text>
    <text x="126" y="274" class="mono g" font-size="12">~/.claude/settings.json</text>
    <g class="mono" font-size="11">
      <rect x="75" y="284" width="123" height="34" rx="6" class="chip"/>
      <text x="85" y="298" class="t">SessionStart</text><text x="85" y="311" class="o" font-size="10">→ idle (wakes it)</text>
      <rect x="208" y="284" width="123" height="34" rx="6" class="chip"/>
      <text x="218" y="298" class="t">UserPromptSubmit</text><text x="218" y="311" class="o" font-size="10">→ thinking</text>
      <rect x="341" y="284" width="123" height="34" rx="6" class="chip"/>
      <text x="351" y="298" class="t">PreToolUse</text><text x="351" y="311" class="o" font-size="10">→ working + tool</text>
      <rect x="75" y="322" width="123" height="34" rx="6" class="chip"/>
      <text x="85" y="336" class="t">PostToolUse</text><text x="85" y="349" class="o" font-size="10">→ thinking</text>
      <rect x="208" y="322" width="123" height="34" rx="6" class="chip"/>
      <text x="218" y="336" class="t">Notification</text><text x="218" y="349" class="o" font-size="10">→ attention + msg</text>
      <rect x="341" y="322" width="123" height="34" rx="6" class="chip"/>
      <text x="351" y="336" class="t">Stop</text><text x="351" y="349" class="o" font-size="10">→ done</text>
    </g>

    <line x1="265" y1="363" x2="265" y2="388" class="flow" marker-end="url(#ah)"/>
    <text x="276" y="380" class="sans g" font-size="11">event JSON on stdin</text>

    <!-- Scripts -->
    <rect x="55" y="392" width="420" height="118" rx="10" class="box"/>
    <text x="75" y="415" class="sans h" font-size="15">Scripts</text>
    <text x="134" y="415" class="mono g" font-size="12">scripts/, justfile</text>
    <g class="sans" font-size="10.5">
      <rect x="75" y="425" width="189" height="74" rx="6" class="chip"/>
      <text x="85" y="443" class="mono h" font-size="12">hook.sh</text>
      <text x="85" y="460" class="g">jq + curl -4</text>
      <text x="85" y="474" class="g">runs in background</text>
      <text x="85" y="488" class="g">1s timeout</text>
      <rect x="275" y="425" width="189" height="74" rx="6" class="chip"/>
      <text x="285" y="443" class="mono h" font-size="12">statusline.sh</text>
      <text x="285" y="460" class="g">Claude Code status line</text>
      <text x="285" y="474" class="g">forwards plan limits</text>
      <text x="285" y="488" class="g">to /usage</text>
    </g>

    <line x1="265" y1="511" x2="265" y2="540" class="flow"/>
    <text x="276" y="528" class="sans g" font-size="11">calls the API endpoint</text>

    <!-- Bonjour -->
    <rect x="55" y="540" width="420" height="130" rx="10" fill="#f3f2ed" stroke="#a9a69e" stroke-width="1.2" stroke-dasharray="6 4"/>
    <path d="M265,540 V575 H501" class="mdns"/>
    <text x="75" y="565" class="sans h" font-size="15">Bonjour (mDNS)</text>
    <text x="75" y="592" class="mono o" font-size="14">claude-pet.local → 192.168.x.x</text>
    <text x="75" y="616" class="sans g" font-size="12">macOS resolves the name the pet announces on the LAN,</text>
    <text x="75" y="633" class="sans g" font-size="12">so the router can hand it any IP.</text>
  </g>

  <!-- ================= WI-FI ROUTER ================= -->
  <g transform="translate(0,133)">
    <g fill="none" stroke="#6b6964" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M632,394 a8,8 0 0 1 16,0"/>
      <path d="M624,394 a16,16 0 0 1 32,0" opacity="0.7"/>
      <path d="M616,394 a24,24 0 0 1 48,0" opacity="0.5"/>
    </g>
    <circle cx="640" cy="396" r="2.5" fill="#6b6964"/>
    <line x1="615" y1="432" x2="607" y2="406" stroke="#4a4a52" stroke-width="3" stroke-linecap="round"/>
    <line x1="665" y1="432" x2="673" y2="406" stroke="#4a4a52" stroke-width="3" stroke-linecap="round"/>
    <rect x="600" y="432" width="80" height="36" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <circle cx="618" cy="450" r="2.5" fill="#28c840"/>
    <circle cx="630" cy="450" r="2.5" fill="#28c840"/>
    <circle cx="642" cy="450" r="2.5" fill="#28c840"/>
    <text x="640" y="492" class="sans h" font-size="13" text-anchor="middle">Wi-Fi router</text>
    <text x="640" y="508" class="sans g" font-size="11" text-anchor="middle">2.4 GHz home LAN</text>
  </g>

  <!-- HTTP: Mac -> router -> ESP -->
  <line x1="501" y1="575" x2="600" y2="575" class="http"/>
  <text x="550" y="566" class="sans o" font-size="12" font-weight="600" text-anchor="middle">HTTP API</text>
  <line x1="682" y1="575" x2="778" y2="575" class="http" marker-end="url(#aho)"/>
  <g class="mono g" font-size="10.5">
    <text x="692" y="524">GET /</text>
    <text x="692" y="538">GET /state</text>
    <text x="692" y="552">GET /usage</text>
    <text x="692" y="566">GET /say</text>
  </g>
  <!-- OTA: just flash -> POST /update -->
  <line x1="501" y1="592" x2="600" y2="592" class="ota"/>
  <text x="550" y="609" class="sans b" font-size="12" font-weight="600" text-anchor="middle">OTA update</text>
  <line x1="682" y1="592" x2="778" y2="592" class="ota" marker-end="url(#ahb)"/>
  <text x="730" y="609" class="mono b" font-size="10.5" text-anchor="middle">POST /update</text>

  <!-- mDNS: ESP announces -> Bonjour -->
  <line x1="778" y1="664" x2="501" y2="664" class="mdns" marker-end="url(#ah)"/>
  <text x="640" y="681" class="sans g" font-size="11" text-anchor="middle">mDNS: "I'm claude-pet.local"</text>

  <!-- ================= ESP32 BOARD ================= -->
  <g transform="translate(975,110) scale(0.7) translate(-975,-110)">
    <!-- USB-C -->
    <rect x="788" y="196" width="16" height="42" rx="5" fill="#9a9aa2"/>
    <rect x="792" y="203" width="6" height="28" rx="3" fill="#3a3a40"/>
    <!-- PCB -->
    <rect x="800" y="110" width="350" height="205" rx="16" fill="#121317" stroke="#2e3038" stroke-width="1.5"/>
    <!-- bezel -->
    <rect x="812" y="121" width="326" height="182" rx="10" fill="#050506" stroke="#26262b"/>

    <!-- the screen, in the firmware's own 320x172 coordinates -->
    <g transform="translate(815,126)">
      <rect width="320" height="172" fill="#0b0b0d"/>
      <line x1="0" y1="156.5" x2="320" y2="156.5" stroke="#3a3835" stroke-dasharray="4 4"/>
      <!-- laptop -->
      <rect x="190" y="153" width="48" height="3" fill="#807d76"/>
      <rect x="196" y="123" width="38" height="30" fill="#807d76"/>
      <rect x="198" y="125" width="34" height="26" fill="#0b0b0d"/>
      <rect x="201" y="128" width="20" height="2" fill="#7ac96e"/>
      <rect x="201" y="133" width="26" height="2" fill="#7ac96e"/>
      <rect x="201" y="138" width="14" height="2" fill="#7ac96e"/>
      <rect x="201" y="143" width="22" height="2" fill="#7ac96e"/>
      <rect x="201" y="148" width="12" height="2" fill="#f0eee6"/>
      <!-- the bot, 16x10 grid of 6px pixels, typing -->
      <g fill="#cc7a5a">
        <rect x="102" y="96" width="72" height="48"/>
        <rect x="90" y="114" width="12" height="12"/>
        <rect x="174" y="120" width="12" height="12"/>
        <rect x="108" y="144" width="6" height="12"/>
        <rect x="120" y="144" width="6" height="12"/>
        <rect x="150" y="144" width="6" height="12"/>
        <rect x="162" y="144" width="6" height="12"/>
      </g>
      <rect x="118" y="111" width="6" height="12" fill="#0b0b0d"/>
      <rect x="160" y="111" width="6" height="12" fill="#0b0b0d"/>
      <!-- speech bubble -->
      <rect x="96" y="48" width="84" height="32" fill="#f0eee6"/>
      <rect x="94" y="50" width="88" height="28" fill="#f0eee6"/>
      <rect x="134" y="80" width="8" height="4" fill="#f0eee6"/>
      <rect x="136" y="84" width="4" height="4" fill="#f0eee6"/>
      <text x="138" y="70" class="mono" font-size="16" font-weight="700" fill="#0b0b0d" text-anchor="middle">On it!</text>
    </g>
  </g>
  <text x="975" y="282" class="sans h" font-size="13" text-anchor="middle">Waveshare ESP32-C6-Touch-LCD-1.47</text>
  <text x="975" y="299" class="sans g" font-size="11" text-anchor="middle">1.47" IPS touch display, 320×172, Wi-Fi 6, USB-C power</text>

  <!-- ================= FIRMWARE ================= -->
  <g>
    <rect x="780" y="392" width="390" height="298" rx="14" fill="#fbfaf7" stroke="#dedcd5"/>
    <text x="800" y="416" class="sans h" font-size="15">Firmware</text>

    <!-- main column -->
    <rect x="800" y="430" width="220" height="48" rx="8" class="box"/>
    <text x="812" y="450" class="mono o" font-size="12" font-weight="700">net/</text>
    <text x="848" y="450" class="sans g" font-size="11">web server, mDNS</text>
    <text x="812" y="468" class="mono t" font-size="10.5">port 80, OTA updater</text>

    <line x1="910" y1="479" x2="910" y2="494" class="flow" marker-end="url(#ah)"/>
    <rect x="800" y="498" width="220" height="44" rx="8" class="box"/>
    <text x="812" y="516" class="mono o" font-size="12" font-weight="700">pet/state</text>
    <text x="890" y="516" class="sans g" font-size="11">what Claude is doing</text>
    <text x="812" y="533" class="sans t" font-size="10.5">debounce, idle → sleep → off</text>

    <line x1="910" y1="543" x2="910" y2="556" class="flow" marker-end="url(#ah)"/>
    <rect x="800" y="560" width="220" height="44" rx="8" class="box"/>
    <text x="812" y="578" class="mono o" font-size="12" font-weight="700">pet/scenes, props, speech</text>
    <text x="812" y="595" class="sans t" font-size="10.5">animations, idle antics, bubbles</text>

    <line x1="910" y1="605" x2="910" y2="618" class="flow" marker-end="url(#ah)"/>
    <rect x="800" y="622" width="220" height="48" rx="8" class="box"/>
    <text x="812" y="642" class="mono o" font-size="12" font-weight="700">display/</text>
    <text x="878" y="642" class="sans g" font-size="11">canvas 320×172</text>
    <text x="812" y="660" class="sans t" font-size="10.5">pushed over SPI, ~30 fps</text>

    <!-- side column -->
    <rect x="1036" y="430" width="118" height="48" rx="8" class="box"/>
    <text x="1048" y="450" class="mono o" font-size="12" font-weight="700">usage/</text>
    <text x="1048" y="468" class="sans t" font-size="10.5">plan limits page</text>
    <line x1="1021" y1="454" x2="1034" y2="454" class="flow" marker-end="url(#ah)"/>

    <rect x="1036" y="498" width="118" height="44" rx="8" class="box"/>
    <text x="1048" y="516" class="mono o" font-size="12" font-weight="700">input/touch</text>
    <text x="1048" y="533" class="sans t" font-size="10.5">tap, swipe</text>
    <line x1="1035" y1="520" x2="1022" y2="520" class="flow" marker-end="url(#ah)"/>


  </g>

</svg>
